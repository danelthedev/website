{{define "games_grid"}}<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
{{range .}}
  <a href="{{.URL}}" target="_blank" class="group bg-zinc-900 rounded-[16px] border-2 border-white/10 overflow-hidden hover:border-white/20 hover:shadow-[4px_4px_0px_rgba(255,255,255,0.06)] transition block">
    <div class="relative aspect-[16/10] overflow-hidden bg-zinc-800">
      <img src="{{.Cover}}" alt="{{.Name}}" class="w-full h-full object-cover card-img" loading="lazy">
      <div class="absolute top-2 left-2 flex gap-1 mono text-[10px]">
        {{if .WebGame}}<span class="px-2 py-1 rounded-full bg-white text-black">WEB</span>{{else}}<span class="px-2 py-1 rounded-full bg-zinc-700 text-white border border-white/10">DOWNLOAD</span>{{end}}
        {{if .ReleaseDate}}<span class="px-2 py-1 rounded-full bg-black/70 backdrop-blur text-white border border-white/10">{{.ReleaseDate}}</span>{{end}}
      </div>
    </div>
    <div class="p-4">
      <div class="font-semibold leading-tight">{{.Name}}</div>
    </div>
  </a>
{{end}}
</div>{{end}}
